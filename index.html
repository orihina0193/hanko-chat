<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ハンコチャット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: one column. Home and admin scroll as pages; a room is a full-height chat with a fixed composer. Stamps (ハンコ) are the identity. */
:root{
  --bg:#eceff4; --surface:#ffffff; --surface-2:#e2e6ee; --ink:#1c2130; --muted:#5a647a; --line:#d3d8e3;
  --accent:#e0261c; --on-accent:#ffffff; --accent-soft:#fde8e6; --accent-ink:#c61d14;
  --good:#1b7f45; --bad:#c2271d; --notice:#e6ecf8;
  --st-red:#e0261c; --st-blue:#2f5fd8; --st-green:#1b8f4e; --st-purple:#8b3fd0; --st-orange:#d97000; --st-ink:#3a4256;
  --shadow:0 1px 2px rgba(20,30,50,.08),0 8px 24px rgba(20,30,50,.10);
  --scrim:rgba(15,20,30,.55);
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic Medium","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151c; --surface:#1b1f29; --surface-2:#262b39; --ink:#e9ecf3; --muted:#9aa3b8; --line:#2c3242;
    --accent:#ff5b4f; --on-accent:#2a0907; --accent-soft:#3b2022; --accent-ink:#ff8a80;
    --good:#4cc784; --bad:#ff7a70; --notice:#222a3d;
    --st-red:#ff5b4f; --st-blue:#7da2ff; --st-green:#4fd18b; --st-purple:#c493ff; --st-orange:#ffa94d; --st-ink:#b4bbd0;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
    --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151c; --surface:#1b1f29; --surface-2:#262b39; --ink:#e9ecf3; --muted:#9aa3b8; --line:#2c3242;
  --accent:#ff5b4f; --on-accent:#2a0907; --accent-soft:#3b2022; --accent-ink:#ff8a80;
  --good:#4cc784; --bad:#ff7a70; --notice:#222a3d;
  --st-red:#ff5b4f; --st-blue:#7da2ff; --st-green:#4fd18b; --st-purple:#c493ff; --st-orange:#ffa94d; --st-ink:#b4bbd0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.6;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}

/* stamps */
.stamp{display:block;flex:none}
.stamp circle{fill:none;stroke:var(--c);stroke-width:6}
.stamp text{fill:var(--c);font-family:var(--font);font-weight:700}
.c-red{--c:var(--st-red)} .c-blue{--c:var(--st-blue)} .c-green{--c:var(--st-green)}
.c-purple{--c:var(--st-purple)} .c-orange{--c:var(--st-orange)} .c-ink{--c:var(--st-ink)}

/* top bar */
.top{flex:none;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);min-height:56px}
.top .brand{font-size:16px}
.top .grow{flex:1;min-width:0}
.pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.on{background:var(--accent-soft);color:var(--accent-ink)}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.ibtn{flex:none;display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 10px;border-radius:22px;border:0;background:transparent;color:var(--muted);cursor:pointer;gap:2px;grid-auto-flow:column}
.ibtn:hover{background:var(--surface-2)}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn.send{background:var(--accent);color:var(--on-accent)}
.ibtn.send:disabled{opacity:.4;cursor:default}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.label{font-size:14px;font-weight:700}
.hint{font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;min-height:44px;padding:9px 12px;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
input[type=number]{font-variant-numeric:tabular-nums}
.err{font-size:14px;color:var(--bad);font-weight:700;min-height:1.4em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* pages */
.page{flex:1;min-height:0;overflow-y:auto;padding-block:20px 32px;padding-inline:16px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.notice{background:var(--notice);border-radius:12px;padding:12px 14px;font-size:14px}
.sec-title{font-size:17px}
.wrap.tight{gap:12px}
.grow-field{flex:1;min-width:160px}
.hint.full{flex-basis:100%}
.gate-title{font-size:24px;line-height:1.3;overflow-wrap:anywhere}

/* home */
.hero{display:flex;gap:16px;align-items:center}
.hero h1{font-size:28px;line-height:1.25}
.hero p{color:var(--muted);margin-top:4px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);color:var(--accent-ink);font-weight:700;display:grid;place-items:center;font-size:14px}

/* admin */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.stat .v small{font-size:14px;color:var(--muted);font-weight:500}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{flex:none;position:relative;width:52px;height:30px;border-radius:999px;border:0;background:var(--line);cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.rooms{display:flex;flex-direction:column;gap:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.rhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.rhead h3{font-size:17px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px 12px;margin:0}
.facts div{display:flex;flex-direction:column;min-width:0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:20px 8px}

/* room */
.room{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.rtitle{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.rtitle strong{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtitle span{font-size:12px;color:var(--muted)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding-block:8px 16px;padding-inline:16px;display:flex;flex-direction:column}
.day{align-self:center;font-size:12px;color:var(--muted);background:var(--surface-2);padding:2px 12px;border-radius:999px;margin-block:16px 4px}
.msg{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.msg.cont{margin-top:3px}
.msg.me{flex-direction:row-reverse}
.slot{flex:none;width:40px}
.body{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:min(80%,34rem)}
.msg.me .body{align-items:flex-end}
.meta{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted)}
.meta .name{font-weight:700;color:var(--ink);font-size:13px;overflow-wrap:anywhere}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%}
.msg.me .bubble{background:var(--accent-soft);border-color:transparent;border-radius:16px 4px 16px 16px}
.bubble.pic{padding:4px}
.picbtn{display:block;padding:0;border:0;background:none;cursor:zoom-in;border-radius:12px;max-width:100%}
.picbtn img{display:block;max-width:100%;max-height:300px;width:auto;height:auto;border-radius:12px}
.rx{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.msg.me .rx{justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer}
.chip .n{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip.add{color:var(--muted);padding:0 8px}
.chip.add svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
@media (hover:hover){
  .chip.add{opacity:0}
  .msg:hover .chip.add,.msg:focus-within .chip.add,.chip.add.open{opacity:1}
}
.picker{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.picker button{width:38px;height:38px;border-radius:50%;border:0;background:none;font-size:20px;cursor:pointer}
.picker button:hover{background:var(--surface-2)}
.newpill{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;z-index:2;display:inline-flex;gap:6px;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:var(--shadow);cursor:pointer}
.newpill svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pending{flex:none;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--surface);border-top:1px solid var(--line)}
.pending img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.pending .grow{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.composer{flex:none;display:flex;align-items:flex-end;gap:6px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;resize:none;border-radius:22px;padding:10px 16px;line-height:1.5;max-height:140px;background:var(--bg);overflow-y:auto}

/* join form */
.gate{align-items:stretch}
.preview{display:flex;gap:16px;align-items:center}
.swatches{display:flex;gap:4px}
.swatch{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;padding:6px 2px;border-radius:10px;border:2px solid transparent;background:none;cursor:pointer;font-size:13px}
.swatch .dot{width:26px;height:26px;border-radius:50%;background:var(--c)}
.swatch[aria-checked="true"]{border-color:var(--c)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;outline:none}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:18px}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;min-height:52px;padding:8px 6px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;font-weight:700}
.menu button small{font-weight:400;color:var(--muted);font-size:13px}
.menu button:disabled{opacity:.5;cursor:default}
.menu button.danger{color:var(--bad)}
.menu button:last-child{border-bottom:0}
.mlist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.mlist li{display:flex;align-items:center;gap:12px}
.lightbox{align-items:center;cursor:zoom-out}
.lightbox img{max-width:96%;max-height:92%;border-radius:8px}
.copybox{display:flex;flex-direction:column;gap:8px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;max-width:min(92%,420px);pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;box-shadow:var(--shadow);text-align:center}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}
.loading,.loadfail{color:var(--muted);text-align:center;padding:40px 16px}
[hidden]{display:none!important}
</style>
</head>

function stampEl(text, color, size) {

function route(r) {

  const key = r.k + (r.id || '');
  if (key === App.routeKey && App.view) return;
  App.routeKey = key;
  if (App.view && App.view.destroy) App.view.destroy();

async function purgeCollection(colRef) {
  for (;;) {
    const snap = await getDocs(query(colRef, limit(300)));
    if (snap.empty) return;
    const b = writeBatch(adminDb);
    snap.docs.forEach(function (d) { b.delete(d.ref); });
    await b.commit();
    if (snap.size < 300) return;
  }
}

function buildDash(wrap) {

  let loading = {};

      proofFor(id, pass).then(function (passHash) {

        b.set(doc(adminDb, 'rooms', id), { name: name, hasPass: !!pass, createdAt: serverTimestamp() });
        b.set(doc(adminDb, 'roomSecrets', id), { passHash: passHash });
        return b.commit();
      }).then(function () {
        nameIn.value = ''; passIn.value = '';
        toast('部屋をつくりました。招待URLをコピーできます');
      }, function (e2) { cerr.textContent = fbErr(e2); }).then(function () { cbtn.disabled = false; });
    }
  },
    h('h2', { class: 'sec-title', text: '部屋をつくる' }),
    h('div', { class: 'field' }, h('label', { for: 'new-name', text: '部屋の名前' }), nameIn),
    h('div', { class: 'field' }, h('label', { for: 'new-pass', text: '合言葉（なくてもOK）' }), passIn,
      h('span', { class: 'hint', text: '設定すると、招待URLを知っていても合言葉がないと入れません。数字4桁など短いものは避けてください。' })),
    cerr, cbtn);
  const refreshBtn = h('button', {
    class: 'btn small', type: 'button', onclick: function () { counts = {}; loading = {}; renderAll(); loadCounts(); }
  }, '数を更新');
  wrap.append(
    statsEl,
    createForm,
    h('section', { class: 'wrap tight' },
      h('div', { class: 'rhead' }, h('h2', { class: 'sec-title', text: '部屋の一覧' }), refreshBtn),
      listEl),
    h('section', { class: 'card' },
      h('h2', { class: 'sec-title', text: '自動で消えるもの' }),
      h('p', { class: 'hint', text: 'メッセージは' + RETENTION_DAYS + '日たつと表示されなくなり、入室している人の画面が開かれたときに順に削除されます。' + RETENTION_DAYS + '日間まったく発言のない部屋は、この画面を開いたときに部屋ごと削除されます。' })));

  function createdMs(r) { return tsMs(r.createdAt) || Date.now(); }
  function activityMs(r) { const c = counts[r.id]; return Math.max(createdMs(r), (c && c.last) || 0); }

  function renderStats() {
    let members = 0, msgs = 0, ready = true;
    rooms.forEach(function (r) {
      const c = counts[r.id];
      if (c) { members += c.members; msgs += c.messages; } else ready = false;
    });
    function stat(k, v) { return h('div', { class: 'stat' }, h('span', { class: 'k', text: k }), h('span', { class: 'v', text: String(v) })); }
    statsEl.replaceChildren(
      stat('部屋', rooms.length),
      stat('参加している人', ready ? members : '…'),
      stat('メッセージ', ready ? msgs : '…'));
  }
  function renderList() {
    if (ui.editPass) return;
    if (!rooms.length) { listEl.replaceChildren(h('div', { class: 'empty', text: 'まだ部屋がありません。上のフォームで最初の部屋をつくります。' })); return; }
    listEl.replaceChildren.apply(listEl, rooms.map(roomCard));
  }
  function renderAll() { renderStats(); renderList(); }

  function roomCard(r) {
    const c = counts[r.id];
    const left = Math.max(0, Math.ceil((activityMs(r) + RETENTION_DAYS * DAY_MS - Date.now()) / DAY_MS));
    const confirming = ui.confirmDel === r.id;
    const editing = ui.editPass === r.id;
    const busy = !!deleting[r.id];
    const actions = h('div', { class: 'row' },
      h('button', { class: 'btn small primary', type: 'button', onclick: function () { go('r-' + r.id); } }, '部屋に入る'),
      h('button', { class: 'btn small', type: 'button', onclick: function () { copyText(inviteUrl(r.id), '招待URL'); } }, '招待URLをコピー'),
      h('button', {
        class: 'btn small', type: 'button', onclick: function () {
          ui.editPass = editing ? null : r.id; ui.confirmDel = null; renderList();
        }
      }, '合言葉'),
      confirming
        ? [h('button', {
          class: 'btn small danger solid', type: 'button', disabled: busy, onclick: function () {
            deleting[r.id] = true; renderList();
            deleteRoomDeep(r.id).then(function () { ui.confirmDel = null; toast('部屋を削除しました'); }, function (e) { toast(fbErr(e)); })
              .then(function () { delete deleting[r.id]; renderAll(); });
          }
        }, busy ? '削除中…' : '本当に削除する'),
        h('button', { class: 'btn small', type: 'button', disabled: busy, onclick: function () { ui.confirmDel = null; renderList(); } }, 'やめる')]
        : h('button', { class: 'btn small danger', type: 'button', onclick: function () { ui.confirmDel = r.id; ui.editPass = null; renderList(); } }, '削除'));
    let passForm = null;
    if (editing) {
      const pin = h('input', { id: 'edit-pass-' + r.id, type: 'text', maxlength: '30', autocomplete: 'off', 'aria-label': '新しい合言葉' });
      passForm = h('form', {
        class: 'row', onsubmit: function (e) {
          e.preventDefault();
          const v = pin.value.trim();
          proofFor(r.id, v).then(function (passHash) {
            const b = writeBatch(adminDb);
            b.update(doc(adminDb, 'rooms', r.id), { hasPass: !!v });
            b.set(doc(adminDb, 'roomSecrets', r.id), { passHash: passHash });
            return b.commit();
          }).then(function () { ui.editPass = null; toast(v ? '合言葉を変えました' : '合言葉を外しました'); renderList(); },
            function (e2) { toast(fbErr(e2)); });
        }
      },
        h('div', { class: 'field grow-field' }, pin),
        h('button', { class: 'btn small primary', type: 'submit' }, '保存'),
        h('button', { class: 'btn small', type: 'button', onclick: function () { ui.editPass = null; renderList(); } }, 'やめる'),
        h('span', { class: 'hint full', text: '空欄で保存すると、合言葉を外します。すでに入っている人は、そのまま使えます。' }));
    }
    return h('article', { class: 'rcard' },
      h('div', { class: 'rhead' },
        h('h3', { text: r.name }),
        h('div', { class: 'tags' },
          r.hasPass ? h('span', { class: 'pill on', text: '合言葉あり' }) : h('span', { class: 'pill', text: '合言葉なし' }),
          c ? h('span', { class: 'pill', text: 'あと' + left + '日で消える' }) : null)),
      h('dl', { class: 'facts' },
        h('div', null, h('dt', { text: '参加' }), h('dd', { text: c ? c.members + '人' : '…' })),
        h('div', null, h('dt', { text: 'メッセージ' }), h('dd', { text: c ? c.messages + '件' : '…' })),
        h('div', null, h('dt', { text: '最後の発言' }), h('dd', { text: c ? (c.last ? ago(c.last) : 'まだなし') : '…' })),
        h('div', null, h('dt', { text: 'つくった日' }), h('dd', { text: fmtDate(createdMs(r)) }))),
      actions, passForm);
  }

  async function loadCounts() {
    const targets = rooms.filter(function (r) { return !counts[r.id] && !loading[r.id]; });
    await Promise.all(targets.map(async function (r) {
      loading[r.id] = true;
      try {
        const mCol = collection(adminDb, 'rooms', r.id, 'members');
        const gCol = collection(adminDb, 'rooms', r.id, 'messages');
        const res = await Promise.all([
          getCountFromServer(mCol),
          getCountFromServer(gCol),
          getDocs(query(gCol, orderBy('createdAt', 'desc'), limit(1)))
        ]);
        let last = 0;
        if (!res[2].empty) last = tsMs(res[2].docs[0].data().createdAt) || 0;
        counts[r.id] = { members: res[0].data().count, messages: res[1].data().count, last: last };
      } catch (e) {
        if (!stopped) toast(fbErr(e));
      }
      delete loading[r.id];
    }));
    if (stopped) return;
    renderAll();
    // 14日間まったく発言のない部屋は、部屋ごと消す
    rooms.forEach(function (r) {
      const c = counts[r.id];
      if (!c || deleting[r.id] || !tsMs(r.createdAt)) return;
      if (Date.now() - activityMs(r) > RETENTION_DAYS * DAY_MS) {
        deleting[r.id] = true;
        deleteRoomDeep(r.id).then(function () { toast('「' + r.name + '」は' + RETENTION_DAYS + '日間動きがなかったので削除しました'); },
          function (e) { toast(fbErr(e)); }).then(function () { delete deleting[r.id]; });
      }
    });
  }

  const unsub = onSnapshot(query(collection(adminDb, 'rooms'), orderBy('createdAt', 'desc')), function (snap) {
    rooms = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data({ serverTimestamps: 'estimate' })); });

    renderAll();
    loadCounts();
  }, function (e) {
    listEl.replaceChildren(h('div', { class: 'card' }, h('p', { text: fbErr(e) })));
  });
  renderAll();
  return { stop: function () { stopped = true; unsub(); } };
}

  }
  function onStamp(e) {
    if (e && e.isComposing) return;
    touched = true;
    const v = clipChars(stampIn.value, 2);
    if (v !== stampIn.value) stampIn.value = v;
    drawPreview();
  }
  name.addEventListener('input', onName);
  name.addEventListener('compositionend', function () { onName(); });
  stampIn.addEventListener('input', onStamp);
  stampIn.addEventListener('compositionend', function () { onStamp(); });

  const form = h('form', {
    class: 'card', onsubmit: function (e) {
      e.preventDefault();
      err.textContent = '';
      const n = name.value.trim();
      if (!n) { err.textContent = 'この部屋で使う名前を入力してください'; name.focus(); return; }
      const t = clipChars(stampIn.value.trim() || n, 2);
      if (pass && !pass.value.trim()) { err.textContent = '合言葉を入力してください'; pass.focus(); return; }
      submit.disabled = true;
      new Promise(function (res) { res(o.onSubmit({ name: n, text: t, color: color, pass: pass ? pass.value : '' })); })
        .then(function () { }, function (e2) { err.textContent = o.mapError ? o.mapError(e2) : fbErr(e2); })
        .then(function () { submit.disabled = false; });
    }
  },
    h('div', { class: 'preview' }, prevBox,
      h('p', { class: 'hint', text: '発言のたびに、この名前とハンコが表示されます。別の部屋では、別の名前とハンコにできます。' })),
    h('div', { class: 'field' }, h('label', { for: 'id-name', text: '名前（12文字まで）' }), name),
    h('div', { class: 'field' }, h('label', { for: 'id-stamp', text: 'ハンコの文字（1〜2文字）' }), stampIn,
      h('span', { class: 'hint', id: 'id-stamp-hint', text: '名前に合わせて自動で入ります。自由に書き換えられます。' })),
    h('div', { class: 'field' }, h('span', { class: 'label', text: 'ハンコの色' }), swBox),
    pass ? h('div', { class: 'field' }, h('label', { for: 'id-pass', text: 'この部屋の合言葉' }), pass) : null,
    err, submit);
  drawSwatches(); drawPreview();
  return form;
}

/* ---------- image preparation: always shrinks until it fits ---------- */
function prepareImage(file, maxKB) {
  const url = URL.createObjectURL(file);
  return new Promise(function (res, rej) {
    const img = new Image();
    img.onload = function () { res(img); };
    img.onerror = function () { rej(new Error('decode')); };
    img.src = url;
  }).then(function (img) {
    let maxSide = 1280, q = 0.82, data = null, w = 1, hh = 1;
    for (let i = 0; i < 24; i++) {
      const sc = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      w = Math.max(1, Math.round(img.naturalWidth * sc)); hh = Math.max(1, Math.round(img.naturalHeight * sc));
      const c = document.createElement('canvas'); c.width = w; c.height = hh;
      const x = c.getContext('2d');
      x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, hh); x.drawImage(img, 0, 0, w, hh);
      data = c.toDataURL('image/jpeg', q);
      if (data.length * 0.75 <= maxKB * 1024) break;
      if (q > 0.5) q -= 0.12;
      else if (maxSide > 320) maxSide = Math.max(320, Math.round(maxSide * 0.75));
      else q = Math.max(0.2, q - 0.1);
    }
    return { src: data, w: w, h: hh, orig: file.size };
  }).then(function (r) { URL.revokeObjectURL(url); return r; }, function (e) { URL.revokeObjectURL(url); throw e; });
}

/* ---------- room ---------- */
function mountRoom(r) {
  const id = r.id;
  const container = h('div', { class: 'room' });
  root.append(container);
  const RV = {
    mode: null, uid: null, room: null, members: {}, msgs: [],
    gotMembers: false, gotMsgs: false, seen: null, unread: 0,
    pendingImg: null, pickerFor: null, sending: false, forceBottom: false, newCount: 0, sig: '',
    unsubs: [], timers: [], destroyed: false, leaving: false
  };
  const els = {};

  function memberRef() { return doc(db, 'rooms', id, 'members', RV.uid); }
  function setTitle() {
    document.title = (RV.unread ? '(' + RV.unread + ') ' : '') + (RV.room ? RV.room.name + ' - ' : '') + BASE_TITLE;
  }
  function stopListeners() {
    RV.unsubs.forEach(function (u) { try { u(); } catch (e) { /* ignore */ } });
    RV.unsubs = [];
    RV.timers.forEach(function (t) { clearInterval(t); });
    RV.timers = [];
  }
  function showPage(nodes) { container.replaceChildren.apply(container, nodes); }

  /* start */
  showPage(loadingPage());
  (async function begin() {
    try {
      const user = await ensureAnon();
      RV.uid = user.uid;
      const snap = await getDoc(doc(db, 'rooms', id));
      if (RV.destroyed) return;
      if (!snap.exists()) { buildGone(); return; }
      RV.room = Object.assign({ id: id }, snap.data());
      const mine = await getDoc(memberRef());
      if (RV.destroyed) return;
      if (mine.exists()) startChat(); else buildGate();
    } catch (e) {
      if (!RV.destroyed) showPage(errorPage(e));
    }
  })();

  /* gone */
  function buildGone() {
    stopListeners();
    RV.mode = 'gone';
    showPage([
      topbar({ back: true }),
      h('div', { class: 'page' }, h('div', { class: 'wrap' },
        h('div', { class: 'card' },
          h('h2', { class: 'sec-title', text: 'この部屋は見つかりません' }),
          h('p', { text: 'URLが違うか、管理者が部屋を削除したか、' + RETENTION_DAYS + '日間動きがなくて消えた可能性があります。' }),
          h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: function () { go(''); } }, 'ホームへ')))))
    ]);
    document.title = BASE_TITLE;
  }

  /* gate */
  async function buildGate() {
    stopListeners();
    RV.mode = 'gate';
    const rm = RV.room;
    const adminHash = rm.hasPass ? await adminProof(id) : null;
    if (RV.destroyed || RV.mode !== 'gate') return;
    const passNeeded = !!rm.hasPass && adminHash == null;
    const form = identityForm({
      submitLabel: '入室する', passNeeded: passNeeded,
      onSubmit: async function (v) {
        let proof = '';
        if (rm.hasPass) proof = adminHash != null ? adminHash : await proofFor(id, v.pass);
        await setDoc(memberRef(), { name: v.name, stamp: { t: v.text, c: v.color }, joinedAt: serverTimestamp(), proof: proof });
        startChat();
      },
      mapError: function (e) {
        if (e && e.code === 'permission-denied') return passNeeded ? '合言葉が違います' : 'この部屋に入れませんでした。管理者に確認してください';
        return fbErr(e);
      }
    });
    showPage([
      topbar({ back: false }),
      h('div', { class: 'page' }, h('div', { class: 'wrap gate' },
        h('div', null, h('h1', { class: 'gate-title', text: rm.name }), h('p', { class: 'hint', text: 'この部屋で使う名前とハンコを決めて入ります。' })),
        form,
        h('p', { class: 'hint', text: 'この端末で入った記録は、ブラウザのデータを消すと消えます。そのときは、もう一度名前とハンコを決めて入ってください。' })))
    ]);
    document.title = rm.name + ' - ' + BASE_TITLE;
  }

  /* chat */
  function startChat() {
    stopListeners();
    RV.mode = 'chat';
    RV.members = {}; RV.msgs = []; RV.gotMembers = false; RV.gotMsgs = false; RV.seen = null; RV.sig = ''; RV.leaving = false;
    buildChatShell();
    function onErr(e) {
      if (RV.destroyed || RV.leaving) return;
      if (e && e.code === 'permission-denied') {
        // 入室の記録がなくなった（管理者が外した、など）
        getDoc(memberRef()).then(function (m) { if (!m.exists()) buildGate(); }, function () { });
        return;
      }
      toast(fbErr(e));
    }
    RV.unsubs.push(onSnapshot(doc(db, 'rooms', id), function (s) {
      if (!s.exists()) { buildGone(); return; }
      RV.room = Object.assign({ id: id }, s.data());
      updateHeader();
    }, onErr));
    RV.unsubs.push(onSnapshot(collection(db, 'rooms', id, 'members'), function (s) {
      const mm = {};
      s.forEach(function (d) { mm[d.id] = d.data(); });
      RV.members = mm; RV.gotMembers = true;
      updateHeader(); updateChat();
    }, onErr));
    const cutoff = Timestamp.fromMillis(Date.now() - RETENTION_DAYS * DAY_MS);
    RV.unsubs.push(onSnapshot(query(collection(db, 'rooms', id, 'messages'), where('createdAt', '>', cutoff), orderBy('createdAt', 'desc'), limit(150)), function (s) {
      const list = [];
      s.forEach(function (d) {
        const x = d.data({ serverTimestamps: 'estimate' });
        list.push({ id: d.id, uid: x.uid, text: x.text || '', img: x.img || null, ts: tsMs(x.createdAt) || Date.now(), rx: x.rx || {} });
      });
      list.reverse();
      RV.msgs = list; RV.gotMsgs = true;
      updateChat();
    }, onErr));
    cleanupExpired();
    RV.timers.push(setInterval(cleanupExpired, 30 * 60 * 1000));
  }

  // 14日たったメッセージを、開いている人の画面から少しずつ消す
  async function cleanupExpired() {
    try {
      const cut = Timestamp.fromMillis(Date.now() - (RETENTION_DAYS * DAY_MS + 3600000));
      const s = await getDocs(query(collection(db, 'rooms', id, 'messages'), where('createdAt', '<=', cut), limit(25)));
      await Promise.all(s.docs.map(function (d) { return deleteDoc(d.ref).catch(function () { }); }));
    } catch (e) { /* 掃除は失敗しても困らない */ }
  }

  function buildChatShell() {
    els.title = h('strong', { text: RV.room.name });
    els.sub = h('span', { text: 'メッセージは' + RETENTION_DAYS + '日で消えます' });
    els.count = h('span');
    els.membersBtn = h('button', { class: 'ibtn', type: 'button', 'aria-label': '参加している人を見る', onclick: openMembers }, icon('users'), els.count);
    const menuBtn = h('button', { class: 'ibtn', type: 'button', 'aria-label': 'メニュー', onclick: openMenu }, icon('dots'));
    const header = h('header', { class: 'top' },
      h('div', { class: 'rtitle grow' }, els.title, els.sub),
      els.membersBtn, menuBtn);
    els.list = h('div', { class: 'msgs', role: 'log', 'aria-live': 'off' });
    els.list.appendChild(h('div', { class: 'loading', text: 'よみこんでいます…' }));
    els.list.addEventListener('scroll', function () { if (nearBottom()) hidePill(); });
    els.pill = h('button', { class: 'newpill', type: 'button', hidden: true, onclick: function () { scrollBottom(); hidePill(); } });
    els.pending = h('div', { class: 'pending', hidden: true });
    els.ta = h('textarea', { id: 'msg-input', rows: '1', maxlength: '2000', 'aria-label': 'メッセージ', placeholder: 'メッセージを入力' });
    els.file = h('input', { type: 'file', accept: 'image/*', hidden: true, id: 'msg-file', 'aria-label': '画像を選ぶ' });
    els.imgBtn = h('button', { class: 'ibtn', type: 'button', 'aria-label': '画像を添付', onclick: function () { els.file.click(); } }, icon('image'));
    els.send = h('button', { class: 'ibtn send', type: 'button', 'aria-label': '送信', disabled: true, onclick: send }, icon('send'));
    const composer = h('div', { class: 'composer' }, els.imgBtn, els.ta, els.send, els.file);
    els.ta.addEventListener('input', function () { autosize(); syncSend(); });
    els.ta.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia && matchMedia('(hover:hover)').matches) { e.preventDefault(); send(); }
    });
    els.file.addEventListener('change', onFile);
    showPage([header, els.list, els.pill, els.pending, composer]);
    setTitle();
  }
  function updateHeader() {
    if (RV.mode !== 'chat' || !els.title) return;
    els.title.textContent = RV.room.name;
    els.count.textContent = String(Object.keys(RV.members).length);
    setTitle();
  }
  function autosize() {
    els.ta.style.height = 'auto';
    els.ta.style.height = Math.min(els.ta.scrollHeight, 140) + 'px';
  }
  function syncSend() { els.send.disabled = RV.sending || (!els.ta.value.trim() && !RV.pendingImg); }
  function nearBottom() { return els.list.scrollHeight - els.list.scrollTop - els.list.clientHeight < 90; }
  function scrollBottom() { els.list.scrollTop = els.list.scrollHeight; }
  function hidePill() { RV.newCount = 0; els.pill.hidden = true; }
  function showPill(n) {
    RV.newCount += n;
    els.pill.replaceChildren('新着 ' + RV.newCount + '件', icon('down'));
    els.pill.hidden = false;
  }

  function computeSig() {
    const me = RV.uid;
    const msgs = RV.msgs.map(function (m) {
      const rx = m.rx || {};
      const parts = Object.keys(rx).map(function (u) { return u.slice(0, 4) + (rx[u] || []).join('') + (u === me ? '*' : ''); }).join(',');
      return m.id + ':' + parts;
    }).join('|');
    const mem = Object.keys(RV.members).map(function (k) { const x = RV.members[k]; return k + x.name + x.stamp.t + x.stamp.c; }).join('|');
    return msgs + '#' + mem + '#' + RV.pickerFor;
  }
  function updateChat() {
    if (RV.mode !== 'chat' || !RV.gotMembers || !RV.gotMsgs) return;
    const sig = computeSig();
    if (sig === RV.sig) return;
    RV.sig = sig;
    const me = RV.uid;
    const first = RV.seen === null;
    const fresh = first ? [] : RV.msgs.filter(function (m) { return !RV.seen.has(m.id) && m.uid !== me; });
    RV.seen = new Set(RV.msgs.map(function (m) { return m.id; }));
    const wasNear = first || nearBottom() || RV.forceBottom;
    const prevTop = els.list.scrollTop;
    renderMsgs();
    if (wasNear) scrollBottom(); else els.list.scrollTop = prevTop;
    RV.forceBottom = false;
    if (fresh.length) {
      if (document.hidden) notifyIncoming(fresh);
      else if (!wasNear) showPill(fresh.length);
    }
  }
  function notifyIncoming(fresh) {
    RV.unread += fresh.length;
    setTitle();
    if (window.Notification && Notification.permission === 'granted') {
      try {
        const m = fresh[fresh.length - 1];
        const who = RV.members[m.uid] ? RV.members[m.uid].name : 'だれか';
        new Notification(RV.room.name, { body: who + ': ' + (m.text ? m.text.slice(0, 80) : '画像を送りました'), tag: 'hc-' + id });
      } catch (e) { /* ignore */ }
    }
  }

  function renderMsgs() {
    const nodes = [];
    if (!RV.msgs.length) nodes.push(h('div', { class: 'empty', text: 'まだ発言がありません。最初のメッセージを送ってみましょう。' }));
    let prev = null, lastDay = '';
    RV.msgs.forEach(function (m) {
      const dk = dayKey(m.ts);
      if (dk !== lastDay) { nodes.push(h('div', { class: 'day', text: dayLabel(m.ts) })); lastDay = dk; prev = null; }
      const cont = !!(prev && prev.uid === m.uid && m.ts - prev.ts < 5 * 60000);
      nodes.push(msgEl(m, RV.members[m.uid], cont));
      prev = m;
    });
    els.list.replaceChildren.apply(els.list, nodes);
  }
  function msgEl(m, mem, cont) {
    const me = RV.uid;
    const mine = m.uid === me;
    const who = mem || { name: '退室した人', stamp: { t: '？', c: 'ink' } };
    const body = h('div', { class: 'body' });
    if (!cont) body.append(h('div', { class: 'meta' }, h('span', { class: 'name', text: who.name }), h('time', { text: fmtTime(m.ts) })));
    if (m.text) body.append(h('div', { class: 'bubble', text: m.text }));
    if (m.img) body.append(h('div', { class: 'bubble pic' },
      h('button', { class: 'picbtn', type: 'button', 'aria-label': '画像を拡大', onclick: function () { openLightbox(m.img.src); } },
        h('img', { src: m.img.src, width: m.img.w, height: m.img.h, alt: '送られた画像', loading: 'lazy' }))));
    // リアクションを、絵文字ごとの人数にまとめる
    const tally = {};
    Object.keys(m.rx || {}).forEach(function (u) { (m.rx[u] || []).forEach(function (e) { (tally[e] = tally[e] || []).push(u); }); });
    const chips = Object.keys(tally).sort(function (a, b) { return EMOJIS.indexOf(a) - EMOJIS.indexOf(b); }).map(function (e) {
      const on = tally[e].indexOf(me) >= 0;
      return h('button', { class: 'chip', type: 'button', 'aria-pressed': String(on), 'aria-label': e + ' ' + tally[e].length + '人', onclick: function () { react(m.id, e); } }, e, h('span', { class: 'n', text: tally[e].length }));
    });
    const open = RV.pickerFor === m.id;
    const addBtn = h('button', { class: 'chip add' + (open ? ' open' : ''), type: 'button', 'aria-label': 'リアクションを選ぶ', 'aria-expanded': String(open), onclick: function () { RV.pickerFor = open ? null : m.id; RV.sig = ''; updateChat(); } }, icon('plus'));
    const rxRow = h('div', { class: 'rx' }, chips, addBtn);
    if (open) {
      rxRow.append(h('div', { class: 'picker', role: 'group', 'aria-label': 'リアクション' }, EMOJIS.map(function (e) {
        return h('button', { type: 'button', 'aria-label': e, onclick: function () { RV.pickerFor = null; react(m.id, e); } }, e);
      })));
    }
    body.append(rxRow);
    return h('div', { class: 'msg' + (mine ? ' me' : '') + (cont ? ' cont' : '') },
      cont ? h('div', { class: 'slot' }) : stampEl(who.stamp.t, who.stamp.c, 40),
      body);
  }

  async function react(msgId, emoji) {
    const m = RV.msgs.find(function (x) { return x.id === msgId; });
    const mineOn = !!(m && (m.rx[RV.uid] || []).indexOf(emoji) >= 0);
    RV.pickerFor = null;
    try {
      const patch = {};
      patch['rx.' + RV.uid] = mineOn ? arrayRemove(emoji) : arrayUnion(emoji);
      await updateDoc(doc(db, 'rooms', id, 'messages', msgId), patch);
    } catch (e) { toast(fbErr(e)); }
    RV.sig = ''; updateChat();
  }

  function pendingText() {
    const p = RV.pendingImg, now = p.src.length * 0.75;
    if (p.orig > now * 1.15) return '大きい画像を自動で小さくしました（' + fmtSize(p.orig) + ' → 約' + fmtSize(now) + '）';
    return '画像を1枚添付しています（約' + fmtSize(now) + '）';
  }
  function renderPending() {
    if (!RV.pendingImg) { els.pending.hidden = true; els.pending.replaceChildren(); syncSend(); return; }
    els.pending.hidden = false;
    els.pending.replaceChildren(
      h('img', { src: RV.pendingImg.src, alt: '送る画像のプレビュー' }),
      h('div', { class: 'grow', text: pendingText() }),
      h('button', { class: 'ibtn', type: 'button', 'aria-label': '添付をやめる', onclick: function () { RV.pendingImg = null; renderPending(); } }, icon('x')));
    syncSend();
  }
  function onFile() {
    const f = els.file.files && els.file.files[0];
    els.file.value = '';
    if (!f) return;
    if (!/^image\//.test(f.type)) { toast('画像ファイルを選んでください'); return; }
    if (f.size > 60 * 1048576) { toast('画像が大きすぎます（60MBまで）。別の画像を選んでください'); return; }
    toast('画像を小さくしています');
    prepareImage(f, IMG_KB).then(function (img) { RV.pendingImg = img; renderPending(); }, function () {
      toast('この形式の画像は読み込めませんでした。JPEGかPNGでお試しください');
    });
  }
  async function send() {
    if (RV.sending) return;
    const text = els.ta.value.trim();
    if (!text && !RV.pendingImg) return;
    const img = RV.pendingImg;
    RV.sending = true; syncSend();
    try {
      await addDoc(collection(db, 'rooms', id, 'messages'), {
        uid: RV.uid, text: text, img: img ? { src: img.src, w: img.w, h: img.h } : null,
        createdAt: serverTimestamp(), rx: {}
      });
      els.ta.value = ''; RV.pendingImg = null; renderPending(); autosize(); RV.forceBottom = true;
    } catch (e) { toast(fbErr(e)); }
    RV.sending = false; syncSend(); els.ta.focus();
  }

  /* sheets */
  function openMembers() {
    const ids = Object.keys(RV.members);
    const list = h('ul', { class: 'mlist' }, ids.map(function (k) {
      const m = RV.members[k];
      return h('li', null, stampEl(m.stamp.t, m.stamp.c, 36), h('span', { text: m.name + (k === RV.uid ? '（あなた）' : '') }));
    }));
    openSheet('参加している人 ' + ids.length + '人', list);
  }
  function notifyState() {
    if (!('Notification' in window)) return { label: '通知はこのブラウザで使えません', sub: '', disabled: true };
    if (Notification.permission === 'granted') return { label: '通知は許可済みです', sub: '別のタブを開いている間に新着があると、通知とタブ名でお知らせします。', disabled: true };
    if (Notification.permission === 'denied') return { label: '通知がブロックされています', sub: 'ブラウザのサイト設定で許可すると使えます。', disabled: true };
    return { label: '新着の通知を許可する', sub: 'ページを開いている間だけ届きます。', disabled: false };
  }
  function openMenu() {
    let sheet = null;
    function item(label, sub, fn, cls, disabled) {
      return h('button', { type: 'button', class: cls || '', disabled: disabled || false, onclick: function () { sheet.close(); fn(); } }, label, sub ? h('small', { text: sub }) : null);
    }
    const ns = notifyState();
    const menu = h('div', { class: 'menu' },
      item('名前とハンコを変える', 'この部屋での表示だけが変わります。', editIdentity),
      item(ns.label, ns.sub, askNotify, '', ns.disabled),
      item('この部屋から出る', '名前とハンコを手放します。入り直すと新しい名前になります。', leave, 'danger'));
    sheet = openSheet('メニュー', menu);
  }
  function askNotify() {
    try {
      Promise.resolve(Notification.requestPermission()).then(function (p) { toast(p === 'granted' ? '通知を許可しました' : '通知は許可されませんでした'); });
    } catch (e) { toast('このブラウザでは通知を出せません'); }
  }
  function editIdentity() {
    const cur = RV.members[RV.uid];
    if (!cur) return;
    let sheet = null;
    const form = identityForm({
      name: cur.name, text: cur.stamp.t, color: cur.stamp.c, submitLabel: '変更する',
      onSubmit: async function (v) {
        await updateDoc(memberRef(), { name: v.name, stamp: { t: v.text, c: v.color } });
        sheet.close(); toast('変更しました');
      }
    });
    sheet = openSheet('名前とハンコ', form);
  }
  async function leave() {
    RV.leaving = true;
    try {
      await deleteDoc(memberRef());
      stopListeners();
      buildGate();
    } catch (e) {
      RV.leaving = false;
      toast(fbErr(e));
    }
  }

  function onVisible() { if (!document.hidden) { RV.unread = 0; setTitle(); } }
  document.addEventListener('visibilitychange', onVisible);
  App.view = {
    destroy: function () {
      RV.destroyed = true;
      stopListeners();
      document.removeEventListener('visibilitychange', onVisible);
      document.title = BASE_TITLE;
    }
  };
}

/* ---------- boot ---------- */
window.addEventListener('unhandledrejection', function (e) { if (e.reason && e.reason.code) toast(fbErr(e.reason)); });
window.addEventListener('hashchange', function () { route(); });
route();
</script>
</body>
</html>
